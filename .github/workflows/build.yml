name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Doc so phien ban
        id: ver
        run: echo "v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log
      - name: Tom tat loi bien dich
        if: failure()
        run: |
          {
            echo "### Loi bien dich (cac dong bat dau bang e:)"
            echo '```'
            grep -E '^e: |What went wrong' -A2 build.log | head -60 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Dat ten APK theo phien ban
        run: cp app/build/outputs/apk/release/app-release.apk "XemTVLite-v${{ steps.ver.outputs.v }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: XemTVLite-v${{ steps.ver.outputs.v }}
          path: XemTVLite-v*.apk
